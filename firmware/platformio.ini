; PlatformIO project config
; Build/upload the same sketch used by the Arduino IDE.
;
;   pio run                 # compile
;   pio run -t upload        # flash via USB
;   pio device monitor       # serial monitor @ 115200
;
; Boards: pick one env. NodeMCU v1.0 is the default.

[platformio]
src_dir = Room_temp           ; reuse the .ino folder, no file moves needed
default_envs = esp12e

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM9
monitor_port = COM9
build_flags =
    -D MQTT_MAX_PACKET_SIZE=512
lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    knolleary/PubSubClient @ ^2.8
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.10
    bblanchon/ArduinoJson @ ^6.21.5

; --- Generic ESP-12E module (bare ESP8266 + USB-TTL) ---
; Hold GPIO0 LOW + reset to enter flashing mode.
[env:esp12e]
platform = espressif8266
board = esp12e
board_build.f_cpu = 80000000L
board_build.flash_mode = dio
board_build.ldscript = eagle.flash.4m1m.ld   ; 4MB flash, 1MB SPIFFS/LittleFS
upload_resetmethod = ck                       ; manual / DTR-RTS depending on adapter
; upload_port set globally to COM9 — override here if a specific board uses another port

; --- NodeMCU v1.0 (ESP-12E on dev board, auto-reset) ---
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2

; --- Wemos D1 mini ---
[env:d1_mini]
platform = espressif8266
board = d1_mini

; --- OTA upload (after first USB flash, device must be on Wi-Fi) ---
; Use:   pio run -e esp12e_ota -t upload --upload-port <device-ip>
; or set upload_port to the device IP / mDNS name (e.g. room1.local)
[env:esp12e_ota]
extends = env:esp12e
upload_protocol = espota
upload_port = 14.10.1.129
upload_flags =
    --auth=REDACTED_OTA_PASS


; --- OTA upload example: copy this env, set IP, then `pio run -e ota -t upload`
;[env:ota]
;platform = espressif8266
;board = esp12e
;upload_protocol = espota
;upload_port = 192.168.1.50          ; device IP
;upload_flags =
;    --auth=YOUR_OTA_PASSWORD
